name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify required secrets are present
        run: |
          MISSING=0
          [ -z "$VITE_FIREBASE_API_KEY" ]            && echo "MISSING: VITE_FIREBASE_API_KEY"            && MISSING=1
          [ -z "$VITE_FIREBASE_AUTH_DOMAIN" ]        && echo "MISSING: VITE_FIREBASE_AUTH_DOMAIN"        && MISSING=1
          [ -z "$VITE_FIREBASE_PROJECT_ID" ]         && echo "MISSING: VITE_FIREBASE_PROJECT_ID"         && MISSING=1
          [ -z "$VITE_FIREBASE_STORAGE_BUCKET" ]     && echo "MISSING: VITE_FIREBASE_STORAGE_BUCKET"     && MISSING=1
          [ -z "$VITE_FIREBASE_MESSAGING_SENDER_ID" ] && echo "MISSING: VITE_FIREBASE_MESSAGING_SENDER_ID" && MISSING=1
          [ -z "$VITE_FIREBASE_APP_ID" ]             && echo "MISSING: VITE_FIREBASE_APP_ID"             && MISSING=1
          if [ $MISSING -eq 1 ]; then
            echo "ERROR: One or more required Firebase secrets are not set in GitHub Actions."
            echo "Go to: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets are present."
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.oftheday }}
          channelId: live
          projectId: oftheday-c6490
