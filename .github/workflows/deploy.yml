name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify required secrets are present
        run: |
          MISSING=0
          [ -z "$VITE_FIREBASE_API_KEY" ]             && echo "MISSING: VITE_FIREBASE_API_KEY"             && MISSING=1
          [ -z "$VITE_FIREBASE_AUTH_DOMAIN" ]         && echo "MISSING: VITE_FIREBASE_AUTH_DOMAIN"         && MISSING=1
          [ -z "$VITE_FIREBASE_PROJECT_ID" ]          && echo "MISSING: VITE_FIREBASE_PROJECT_ID"          && MISSING=1
          [ -z "$VITE_FIREBASE_STORAGE_BUCKET" ]      && echo "MISSING: VITE_FIREBASE_STORAGE_BUCKET"      && MISSING=1
          [ -z "$VITE_FIREBASE_MESSAGING_SENDER_ID" ] && echo "MISSING: VITE_FIREBASE_MESSAGING_SENDER_ID" && MISSING=1
          [ -z "$VITE_FIREBASE_APP_ID" ]              && echo "MISSING: VITE_FIREBASE_APP_ID"              && MISSING=1
          [ -z "$VITE_STRIPE_MONTHLY_PRICE_ID" ]       && echo "MISSING: VITE_STRIPE_MONTHLY_PRICE_ID"       && MISSING=1
          [ -z "$VITE_STRIPE_ANNUAL_PRICE_ID" ]        && echo "MISSING: VITE_STRIPE_ANNUAL_PRICE_ID"        && MISSING=1
          [ -z "$STRIPE_SECRET_KEY" ]                  && echo "MISSING: STRIPE_SECRET_KEY"                  && MISSING=1
          [ -z "$STRIPE_WEBHOOK_SECRET" ]              && echo "MISSING: STRIPE_WEBHOOK_SECRET"              && MISSING=1
          [ -z "$STRIPE_MONTHLY_PRICE_ID" ]            && echo "MISSING: STRIPE_MONTHLY_PRICE_ID"            && MISSING=1
          [ -z "$STRIPE_ANNUAL_PRICE_ID" ]             && echo "MISSING: STRIPE_ANNUAL_PRICE_ID"             && MISSING=1
          [ -z "$MAILGUN_API_KEY" ]                    && echo "MISSING: MAILGUN_API_KEY"                    && MISSING=1
          [ -z "$MAILGUN_DOMAIN" ]                     && echo "MISSING: MAILGUN_DOMAIN"                     && MISSING=1
          [ -z "$ANTHROPIC_API_KEY" ]                 && echo "MISSING: ANTHROPIC_API_KEY"                 && MISSING=1
          [ -z "$AC_API_KEY" ]                        && echo "MISSING: AC_API_KEY"                        && MISSING=1
          if [ $MISSING -eq 1 ]; then
            echo "ERROR: One or more required secrets are not set in GitHub Actions."
            echo "Go to: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets are present."
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_MONTHLY_PRICE_ID: ${{ secrets.VITE_STRIPE_MONTHLY_PRICE_ID }}
          VITE_STRIPE_ANNUAL_PRICE_ID: ${{ secrets.VITE_STRIPE_ANNUAL_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          STRIPE_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_ANNUAL_PRICE_ID }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}

      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_MONTHLY_PRICE_ID: ${{ secrets.VITE_STRIPE_MONTHLY_PRICE_ID }}
          VITE_STRIPE_ANNUAL_PRICE_ID: ${{ secrets.VITE_STRIPE_ANNUAL_PRICE_ID }}

      - name: Write functions/.env
        run: |
          {
            echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"
            echo "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}"
            echo "STRIPE_MONTHLY_PRICE_ID=${STRIPE_MONTHLY_PRICE_ID}"
            echo "STRIPE_ANNUAL_PRICE_ID=${STRIPE_ANNUAL_PRICE_ID}"
            echo "MAILGUN_API_KEY=${MAILGUN_API_KEY}"
            echo "MAILGUN_DOMAIN=${MAILGUN_DOMAIN}"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            echo "AC_API_KEY=${AC_API_KEY}"
          } > functions/.env
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          STRIPE_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_ANNUAL_PRICE_ID }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}

      - name: Install functions dependencies
        run: npm install --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.oftheday }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting --project oftheday-c6490 --non-interactive 2>&1 | tee /tmp/hosting.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -q "current active version" /tmp/hosting.log && echo "Hosting already up to date — OK" && exit 0
            exit $code
          fi

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project oftheday-c6490 --non-interactive --force

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project oftheday-c6490 --non-interactive
