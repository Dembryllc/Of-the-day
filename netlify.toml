# ── Build ────────────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Security & caching headers ──────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' blob: data: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self' blob:;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ── HTTPS redirect (version-controlled, not just a dashboard toggle) ─────────

[[redirects]]
  from = "http://oftheday.net/*"
  to   = "https://oftheday.net/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.oftheday.net/*"
  to   = "https://oftheday.net/:splat"
  status = 301
  force  = true

# ── App route (React SPA lives at /app) ─────────────────────────────────────

[[redirects]]
  from   = "/app"
  to     = "/app.html"
  status = 200

[[redirects]]
  from   = "/app/*"
  to     = "/app.html"
  status = 200

# ── SPA fallback for landing page routes ────────────────────────────────────

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
